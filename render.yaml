services:
  - type: web
    name: kokcs-online-assessment
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /
    docker:
      dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASS
        sync: false
